<div class="navigation-wrapper">
	<div class="site-name">
		<a href="{{ site.url }}">{{ site.title }}</a>
	</div><!-- /.site-name -->
  {% capture url %}{{ page.url | remove:'index.html' }}{% endcapture %}
	<div class="top-navigation">
		<nav class="top-navigation__scroll" role="navigation" itemscope itemtype="http://schema.org/SiteNavigationElement">
		    <ul>
		        {% for link in site.links %}
	            <li><a href="{{ site.url }}{{ link.url }}" {% if url == link.url %}class="top-navigation-current" aria-current="page"{% endif %}>{{ link.title }}</a></li>
		        {% endfor %}
		    </ul>
		</nav>
	</div><!-- /.top-navigation -->
	<button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
		<span class="theme-toggle__icon" aria-hidden="true">
			<span class="theme-toggle__moon">☾</span>
			<span class="theme-toggle__sun">☀</span>
		</span>
		<span class="theme-toggle__label">Night</span>
	</button>
</div><!-- /.navigation-wrapper -->
